# Development overrides: live-reload Django + Vite dev server, debug settings, exposed DB.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  db:
    ports: ["5432:5432"]

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      XCORE_LOAD_DEMO: "true"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
    read_only: false
    ports: ["8000:8000"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    read_only: false
    tmpfs: []
