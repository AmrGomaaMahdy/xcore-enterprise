name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xcore
          POSTGRES_USER: xcore
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xcore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint & format
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate on PostgreSQL and load demo data
        run: |
          python manage.py migrate --noinput
          python manage.py load_demo_data
      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing
      - name: Deployment checklist (prod settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-secret-ci-only-not-secret-ci-only-not-secret-xx
          DJANGO_ALLOWED_HOSTS: xcore.example.com
          DJANGO_SSL_REDIRECT: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
          docker build -f Dockerfile.render -t xcore/render:ci .
      - name: Smoke test the stack
        run: |
          sed -i 's/^XCORE_DEMO_PASSWORD=.*/XCORE_DEMO_PASSWORD=Ci-Demo-Passw0rd!/; s/CHANGE_ME_strong_db_password/ci-db-password/' .env
          docker compose up -d
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/api/v1/health/ && break; sleep 3; done
          curl -fsS http://localhost:8080/ | grep -q "X-Core"
          docker compose ps
      - if: always()
        run: docker compose logs --no-color | tail -200
